[project]
name = "ssl-eeg"
version = "1.0.0"
description = "BrainLM-EEG: self-supervised learning of latent EEG representations for mental health related analysis"
requires-python = ">=3.11,<3.12"
dependencies = [
  "braindecode[eegprep,hub]>=1.4.0",
  "huggingface-hub>=1.11.0",
  "joblib>=1.4.0",
  "matplotlib>=3.10.8",
  "mne>=1.11.0",
  "mne-icalabel>=0.8.1",
  "numpy>=2.2.6",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "pycrostates>=0.6.0",
  "PyWavelets>=1.6.0",
  "pyyaml>=6.0.3",
  "safetensors>=0.7.0",
  "scikit-learn>=1.7.2",
  "scipy>=1.17.1",
  "torch==2.10.0",
  # Not imported directly (braindecode needs it); listed so that uv takes the
  # CUDA build from the same index as torch on Linux.
  "torchaudio==2.10.0",
  "wandb>=0.25.0",
  "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

# CUDA 12.6 wheels on Linux (cluster); default PyPI wheels elsewhere (CPU / Apple MPS).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
# torchaudio must come from the same CUDA index as torch.
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
