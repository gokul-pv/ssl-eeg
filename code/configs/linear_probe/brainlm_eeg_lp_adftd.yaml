# BrainLM-EEG linear probe × ADFTD — AD vs HC — rolling

mode: "linear_probe"

dataset_config: "configs/dataset/adftd.yaml"
classify_choice: "ad_vs_hc"
model_config:   "configs/model/brainlm_eeg.yaml"

pretrained_encoder_path: "outputs/checkpoints/pretrain/brainlmeeg/best_pretrain_encoder.pth"

split_save_dir: "metadata"
pretrain_seed: 42

seed: 42
protocol: "rolling"              # rolling (five-fold CV) | loso | full
n_folds: 5
gpu: 0
train_epochs: 50
patience: 10
learning_rate: 1.0e-3
weight_decay: 0.0
warmup_epochs: 0
max_grad_norm: 1.0
batch_size: 128
num_workers: 8
persistent_workers: true

early_stopping_metric: "val_loss"
use_subject_vote: true

save_dir: "outputs/checkpoints/finetune"

use_wandb: true
wandb_project: "eeg-ssl-finetune"
wandb_entity: null                  # your W&B entity/team
wandb_run_name: null
wandb_mode: "offline"
wandb_dir: "outputs/wandb/finetune"
wandb_data_dir: "outputs/wandb/finetune/_wandb_data"
wandb_upload_terminal_log_artifact: true

terminal_log_dir: "outputs/logs/finetune"
