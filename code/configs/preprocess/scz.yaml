# Preprocessing Config — scz (Schizophrenia Resting-State EEG, Zenodo 14808296)

dataset_id: "scz"

# Paths
raw_data_path: "/work/gokul/ssl-eeg/code/data/orig_data/scz/sch_resting_64ch_ec"
excel_path: "/work/gokul/ssl-eeg/code/data/orig_data/scz/schizophrenia_EI_dynamics_table.xlsx"

# Output
data_dir: "data"
save_folder: "L3000_200Hz_EEGPrep_ICA"   # data/scz/L3000_200Hz_EEGPrep_ICA/

# Windowing
seg_len: 3000       # window size in samples (15 s × 200 Hz)
overlap: 0          # no overlap

# Scaling
scale: 1.0e+6     # V → µV

# Bandpass filter
l_freq: 0.5
h_freq: 45.0

# Notch filter
notch_freq: 50.0    # 50 Hz — European power line (Budapest, Hungary)

# EEGPrep
eegprep: true
eegprep_resample_to: 200          # resample 1000 Hz → 200 Hz inside EEGPrep
eegprep_burst_cutoff: 20          # ASR cutoff (z-score)
eegprep_corr_threshold: 0.75      # bad channel correlation threshold (0.75–0.8)
eegprep_common_avg_ref: true      # apply average reference at end of EEGPrep

# ICA
apply_ica: true
ica_n_components: 20              # number of ICA components
ica_prob_threshold: 0.8           # ICLabel probability threshold for exclusion
ica_exclude_labels:               # artifact component types to remove
  - "muscle artifact"
  - "eye blink"
  - "heart beat"
  - "channel noise"
  - "line noise"

# Performance
drop_last_window: true
preload: true
n_jobs: 1
