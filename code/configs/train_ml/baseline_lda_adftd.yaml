# LDA on handcrafted features × ADFTD — AD vs HC — rolling

seed: 42

# CV strategy
protocol: "rolling"              # rolling (five-fold CV) | loso | full
n_folds: 5

dataset_config: "configs/dataset/adftd.yaml"
classify_choice: "ad_vs_hc"

# Model
ml_model: "lda"          # "lda" | "svm" | "xgb"

lda_solver: "svd"         # "svd" | "lsqr" | "eigen"
lda_shrinkage: null       # null | "auto" | float (only with lsqr/eigen)

pca_components: null

# Feature extraction
ml_features:
  domains: ["dft", "time", "dwt", "cwt"]  # any subset of: dft, cwt, dwt, time
  band_limits:
    - [0.5,  4.0]    # delta
    - [4.0,  8.0]    # theta
    - [8.0,  13.0]   # alpha
    - [13.0, 30.0]   # beta
    - [30.0, 45.0]   # gamma
  wavelet: "db4"            # PyWavelets wavelet for DWT
  cwt_wavelet: "morl"       # Morlet wavelet for CWT
  n_jobs: 4                 # parallel workers for feature extraction

# Checkpoint
save_dir: "outputs/checkpoints/train_ml"

normalize: false

# WandB
use_wandb: true
wandb_project: "eeg-baselines"
wandb_entity: null                  # your W&B entity/team
wandb_run_name: null           # auto-generated if null
wandb_mode: "offline"          # "online" | "offline" | "disabled"
wandb_dir: "outputs/wandb/ds004504/"
wandb_upload_terminal_log_artifact: true

# Terminal/File Logs
terminal_log_dir: "outputs/logs/ds004504/baseline_ml"
