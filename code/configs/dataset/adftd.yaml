# Dataset Config — ADFTD-RS (ds004504)

dataset_name: "adftd"             # key in DATASET_REGISTRY

dataset_id: "ds004504"
data_dir: "data"
save_folder: "L3000_200Hz_EEGPrep_ICA"   # must match configs/preprocess/adftd.yaml
sfreq: 200                        # used for model init (info only, not re-applied)

# Classification task
classify_choice: "ad_vs_hc"

# Subject split
cross_val: "mccv"
ratio_a: 0.6      # fraction of subjects for train
ratio_b: 0.8      # fraction for train+val (remainder → test)

# DataLoader
normalize: true   # per-window per-channel z-score normalization
batch_size: 128
num_workers: 0
preload: true
use_subject_vote: true  # log subject-level majority-vote metrics

# CV settings
n_folds: 5
