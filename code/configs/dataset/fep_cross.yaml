# Dataset Config — First Episode Psychosis (ds003944), cross-dataset variant

dataset_name: "fep"               # key in DATASET_REGISTRY

dataset_id: "ds003944"
data_dir: "data"
save_folder: "L3000_200Hz_EEGPrep_ICA"  # must match configs/preprocess/fep.yaml → save_folder
sfreq: 200

# Subject split
cross_val: "mccv"
